name: Feature request
description: Suggest something nnscope should be able to do
labels: ["enhancement"]

body:
  - type: textarea
    id: problem
    attributes:
      label: What can't you see right now
      description: >
        Describe the question you were trying to answer about a training run,
        not the feature. The best additions here started as "I couldn't tell
        whether ..." rather than a UI request.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
      description: Optional. A sketch, a panel, an API shape.
    validations:
      required: false

  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      description: >
        Both of these are load-bearing (see CONTRIBUTING.md). Proposals that
        break either need a good argument, which is fine — just make it here.
      options:
        - label: This wouldn't change how an instrumented script trains
        - label: This shows something true, not just something prettier
